name: Build Stage Pocket Android Debug APK

on:
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node/pnpm setup (aligned with ci.yml)
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # Cache pnpm modules
      - name: Cache pnpm modules
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Cache turbo build artifacts
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Build web bundle
      - run: pnpm -F @proj-airi/stage-pocket run build

      # Verify dist exists before Capacitor sync
      - run: ls -la apps/stage-pocket/dist || (echo "Dist directory missing!"; exit 1)

      # Capacitor sync Android
      - run: pnpm -F @proj-airi/stage-pocket exec cap sync android

      # JDK 21 setup (required for Gradle 8.14.3 / AGP 8.13.0)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK setup
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Make Gradle wrapper executable
      - run: chmod +x apps/stage-pocket/android/gradlew

      # Build debug APK
      - working-directory: apps/stage-pocket/android
        run: ./gradlew assembleDebug --no-daemon

      # Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: stage-pocket-debug-apk
          path: apps/stage-pocket/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error